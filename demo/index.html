<!doctype html><html lang="en"><meta charset="utf-8"><title>Harbor Tasks</title><style>body{font:18px system-ui;max-width:680px;margin:60px auto;padding:20px}input,button{font:inherit;padding:10px}li{padding:12px}button{margin-left:12px}</style><h1>Harbor Tasks</h1><form id="task-form"><label for="task">New task</label><input id="task" autocomplete="off"><button>Add task</button></form><p role="alert" id="error"></p><p role="status" id="count">0 tasks remaining</p><ul id="tasks" aria-label="Tasks"></ul><script>
const form=document.querySelector('form'),input=document.querySelector('input'),list=document.querySelector('ul'),error=document.querySelector('#error');
function update(){document.querySelector('#count').textContent=list.querySelectorAll('input:not(:checked)').length+' tasks remaining'}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){error.textContent='Enter a task';return}error.textContent='';const li=document.createElement('li');const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.addEventListener('change',update);label.append(box,document.createTextNode(text));const del=document.createElement('button');del.textContent='Delete';del.setAttribute('aria-label','Delete '+text);del.onclick=()=>{li.remove();update()};li.append(label,del);list.append(li);input.value='';update()});
</script></html>
